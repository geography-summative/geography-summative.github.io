<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Effect with Accelerometer</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 230px;
            height: 380px;
        }
        .image {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            position: absolute;
        }
        .overlay {
            width: 250px;
            height: 400px;
            position: absolute;
            top: -10px;
            left: -10px;
            border-radius: 20px;
            overflow: hidden;
            filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="overlay" id="overlay">
            <img src="card-3d.png" class="image" id="animated">
        </div>
        <img src="card-3d.png" class="image" id="background">
        
    </div>
    
    <script>
        if (window.DeviceMotionEvent) {
            window.addEventListener("deviceorientation", function(event) {
                let pitch = event.beta || 0;
                let yaw = event.gamma || 0;
                
                let translateX = yaw * -2;
                let translateY = pitch * -1.5;
                
                document.getElementById("animated").style.transform = `translate(${translateX}px, ${translateY}px)`;
            });
        } else {
            alert("Device motion not supported");
        }
    </script>
</body>
</html>
