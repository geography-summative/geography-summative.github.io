<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hovering Card Effect</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: white;
            margin: 0;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 250px;
            height: 400px;
        }
        .card, .blurred-card {
            position: absolute;
            width: 100%;
            height: auto;
            border-radius: 20px;
            transition: transform 0.1s ease-out;
        }
        .blurred-card {
            filter: blur(15px);
            opacity: 0.8;
            transform: translateY(10px) scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="card-3d-rotate.png" class="blurred-card" id="blurred" alt="Blurred Background">
        <img src="card-3d-rotate.png" class="card" id="card" alt="Main Card">
    </div>
    <script>
        window.addEventListener("deviceorientation", (event) => {
            let tiltX = event.beta / 1;
            let tiltY = event.gamma / 1;

            document.getElementById("card").style.transform = `translate(${tiltY}px, ${tiltX}px)`;
            document.getElementById("blurred").style.transform = `translate(${tiltY / 2}px, ${tiltX / 2 + 10}px) scale(1.05)`;
        });
    </script>
</body>
</html>
