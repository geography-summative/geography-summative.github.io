<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MapLibre GeoJSON Example</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {},
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': '#f0f0f0' } }
      ]
    },
    center: [-122.4194, 37.7749],
    zoom: 11
  });

  map.on('load', () => {
    // Add sources
    map.addSource('cities', { type: 'geojson', data: 'cities.geojson' });
    map.addSource('districts', { type: 'geojson', data: 'districts.geojson' });
    map.addSource('pois', { type: 'geojson', data: 'pois.geojson' });
    map.addSource('infra', { type: 'geojson', data: 'infra.geojson' });

    // Cities (large labels at low zooms)
    map.addLayer({
      id: 'city-labels',
      type: 'symbol',
      source: 'cities',
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 20,
        'text-anchor': 'top',
        'text-allow-overlap': true,
        'visibility': 'visible'
      },
      paint: {
        'text-color': '#222'
      },
      minzoom: 5,
      maxzoom: 11
    });

    // Districts (labels show at mid zoom)
    map.addLayer({
      id: 'district-labels',
      type: 'symbol',
      source: 'districts',
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 14,
        'text-anchor': 'center',
        'text-allow-overlap': false
      },
      paint: {
        'text-color': '#0055aa'
      },
      minzoom: 12,
      maxzoom: 14
    });

    // POIs (smaller labels + icons at high zooms)
    map.addLayer({
      id: 'poi-labels',
      type: 'symbol',
      source: 'pois',
      layout: {
        'text-field': ['get', 'name'],
        'text-size': 12,
        'icon-image': [
          'match',
          ['get', 'type'],
          'arts', 'museum-15',
          'library', 'library-15',
          'marker-15'
        ],
        'icon-anchor': 'bottom',
        'text-anchor': 'top',
        'text-offset': [0,0.5],
        'text-optional': true
      },
      paint: {
        'text-color': '#aa0000'
      },
      minzoom: 14
    });

    // Infra: streets
    map.addLayer({
      id: 'streets',
      type: 'line',
      source: 'infra',
      filter: ['==', ['get', 'kind'], 'street'],
      paint: { 'line-color': '#555', 'line-width': 3 }
    });

    // Infra: paths
    map.addLayer({
      id: 'paths',
      type: 'line',
      source: 'infra',
      filter: ['==', ['get', 'kind'], 'path'],
      paint: { 'line-color': '#888', 'line-dasharray': [2,2], 'line-width': 2 }
    });

    // Infra: buildings
    map.addLayer({
      id: 'buildings',
      type: 'fill',
      source: 'infra',
      filter: ['==', ['get', 'kind'], 'building'],
      paint: { 'fill-color': '#cccccc', 'fill-outline-color': '#333' }
    });
  });
</script>
</body>
</html>
